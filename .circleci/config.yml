version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.0
  sonarcloud: sonarsource/sonarcloud@4.0.0

executors:
  docker-python:
    docker:
      - image: cimg/python:3.7
  docker-terraform:
    docker:
      - image: "hashicorp/terraform:1.1.9"
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  terraform-init-then-plan:
    description: "Initializes and run plan from terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
          name: get and init
      - run:
          name: plan
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform plan -out=plan.out
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
            - project/*
  terraform-apply:
    description: "Runs Terraform Apply"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: apply
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform apply -auto-approve plan.out
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  deploy-lambda:
    description: "Deploys API via Serverless"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - setup_remote_docker
      - run:
          name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_20.x | bash -
            apt-get update && apt-get install -y nodejs
      - run:
          name: Install serverless CLI
          command: npm i -g serverless@^3
      - run:
          name: Build lambda
          command: |
            cd ./AssetInformationApi/
            chmod +x ./build.sh
            ./build.sh
      - run:
          name: Deploy lambda
          command: |
            cd ./AssetInformationApi/
            npm i serverless-associate-waf
            npm i @serverless/safeguards-plugin --save-dev
            npx --yes serverless@^4 deploy --stage <<parameters.stage>> --conceal

jobs:
  build-and-test:
    executor: docker-python
    steps:
      - checkout:
          method: full
      - setup_remote_docker
      - sonarcloud/scan
      - run:
          name: build
          command: docker-compose build asset-information-api-test
      - run:
          name: Run tests
          command: docker-compose run asset-information-api-test
  assume-role-development:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_DEVELOPMENT
  terraform-init-and-plan-development:
    executor: docker-terraform
    steps:
      - terraform-init-then-plan:
          environment: "development"
  terraform-apply-development:
    executor: docker-terraform
    steps:
      - terraform-apply:
          environment: "development"
  deploy-to-development:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "development"
  

workflows:
  check-and-deploy-development:
    jobs:
      - permit-dummy-dev-deploy:
          type: approval
      - build-and-test:
          context:
            - api-nuget-token-context
            - SonarCloud
          requires:
            - permit-dummy-dev-deploy
      - assume-role-development:
          context: api-assume-role-housing-development-context
          requires:
            - build-and-test
      - terraform-init-and-plan-development:
          requires:
            - assume-role-development
      - terraform-compliance-development:
          requires:
            - terraform-init-and-plan-development
      - terraform-apply-development:
          requires:
            - terraform-compliance-development
          filters:
            branches:
              only: dummy-authorization-bump-test
      - deploy-to-development:
          context:
            - api-nuget-token-context
            - "Serverless Framework" 
          requires:
            - terraform-apply-development
          filters:
            branches:
              only: dummy-authorization-bump-test
